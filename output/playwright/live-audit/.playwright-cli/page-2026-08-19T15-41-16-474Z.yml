        - generic [ref=e287]:
          - paragraph [ref=e288]: Who You’d Be Working With
          - heading "I’m Steven de la Torre — UX Designer, Game Developer, and Agentic Builder." [level=2] [ref=e290]
          - paragraph [ref=e291]: Based in Columbus, Ohio, I spent years designing player-facing systems for Call of Duty and previously shipped immersive work for Google, the NBA, and the U.S. Air Force. Today I build an indie tactical RPG in Unity, web products with clients and partners, and AI-assisted workflows. I’m at my best when the brief is messy, disciplines overlap, and the experience needs to make sense — not merely function.
      - link "Read the Full Story →" [ref=e293] [cursor=pointer]:
        - /url: /about
    - generic [ref=e294]:
      - generic [ref=e295]:
        - paragraph [ref=e296]: How I Work
        - heading "What Working With Me Looks Like." [level=2] [ref=e298]
      - list [ref=e299]:
        - listitem [ref=e300]:
          - text: "01"
          - heading "I Start With the Experience" [level=3] [ref=e301]
          - paragraph [ref=e302]: Before choosing a framework or drawing a polished screen, I identify what the player, user, or customer should understand, feel, and be able to do.
        - listitem [ref=e303]:
          - text: "02"
          - heading "I Prototype the Dangerous Part" [level=3] [ref=e304]
          - paragraph [ref=e305]: Every project has one assumption that can quietly ruin the rest. I build it early enough to learn before the project becomes expensive to change.
        - listitem [ref=e306]:
          - text: "03"
          - heading "Design and Implementation Stay in the Same Loop" [level=3] [ref=e307]
          - paragraph [ref=e308]: I move from interaction design to technical design to working code without throwing the idea over a wall and hoping it survives.
        - listitem [ref=e309]:
          - text: "04"
          - heading "No Theater, No Unnecessary Architecture" [level=3] [ref=e310]
          - paragraph [ref=e311]: I build the smallest honest version that proves the experience, document the decisions that matter, and leave the system understandable.
