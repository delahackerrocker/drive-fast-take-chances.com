          - heading "The Work" [level=2] [ref=f1e435]
          - paragraph [ref=f1e436]: My work included weapon icon systems, onboarding and first-time-user experience, post-match communication, interface flows, and technical design inside one of the largest live game ecosystems in the world.
        - generic [ref=f1e437]:
          - heading "The Challenge" [level=2] [ref=f1e438]
          - paragraph [ref=f1e439]: Player-facing systems had to remain understandable under pressure while serving new players, experienced players, multiple modes, evolving content, and the realities of cross-studio production.
        - generic [ref=f1e440]:
          - heading "My Role" [level=2] [ref=f1e441]
          - paragraph [ref=f1e442]: I worked across UX, UI, engineering, production, and game design to turn experience intent into specifications and behavior that could survive implementation and live-service change.
        - generic [ref=f1e443]:
          - heading "The Through Line" [level=2] [ref=f1e444]
          - paragraph [ref=f1e445]: The strongest work was never merely a polished screen. It connected what the player needed to understand with the rules, data, feedback, and collaboration required to make that understanding real.
