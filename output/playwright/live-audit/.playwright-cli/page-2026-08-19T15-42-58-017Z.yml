      - generic [ref=f1e278]:
        - generic "Portrait placeholder" [ref=f1e279]: SD
        - generic [ref=f1e281]:
          - paragraph [ref=f1e282]: Who You’d Be Working With
          - heading "I’m Steven de la Torre — UX Designer, Game Developer, and Agentic Builder." [level=2] [ref=f1e284]
          - paragraph [ref=f1e285]: Based in Columbus, Ohio, I spent years designing player-facing systems for Call of Duty and previously shipped immersive work for Google, the NBA, and the U.S. Air Force. Today I build an indie tactical RPG in Unity, web products with clients and partners, and AI-assisted workflows. I’m at my best when the brief is messy, disciplines overlap, and the experience needs to make sense — not merely function.
      - link "Read the Full Story →" [ref=f1e287] [cursor=pointer]:
        - /url: /about
    - generic [ref=f1e288]:
      - generic [ref=f1e289]:
        - paragraph [ref=f1e290]: How I Work
        - heading "What Working With Me Looks Like." [level=2] [ref=f1e292]
      - list [ref=f1e293]:
        - listitem [ref=f1e294]:
          - text: "01"
          - heading "I Start With the Experience" [level=3] [ref=f1e295]
          - paragraph [ref=f1e296]: Before choosing a framework or drawing a polished screen, I identify what the player, user, or customer should understand, feel, and be able to do.
        - listitem [ref=f1e297]:
          - text: "02"
          - heading "I Prototype the Dangerous Part" [level=3] [ref=f1e298]
          - paragraph [ref=f1e299]: Every project has one assumption that can quietly ruin the rest. I build it early enough to learn before the project becomes expensive to change.
        - listitem [ref=f1e300]:
          - text: "03"
          - heading "Design and Implementation Stay in the Same Loop" [level=3] [ref=f1e301]
          - paragraph [ref=f1e302]: I move from interaction design to technical design to working code without throwing the idea over a wall and hoping it survives.
        - listitem [ref=f1e303]:
          - text: "04"
          - heading "No Theater, No Unnecessary Architecture" [level=3] [ref=f1e304]
          - paragraph [ref=f1e305]: I build the smallest honest version that proves the experience, document the decisions that matter, and leave the system understandable.
    - generic [ref=f1e307]:
