        - heading "I Turn Fuzzy Ideas Into Things People Can Use, Play, and Understand." [level=2] [ref=f1e198]
      - paragraph [ref=f1e199]: The feature you can explain but cannot quite design. The prototype that technically works but feels wrong. The game system that exists in documents but not under a player’s thumbs. I find the experience at the center, build the riskiest part first, and carry it across the line without losing the reason it should exist.
